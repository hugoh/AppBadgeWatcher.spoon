[tools]
jactionlint = "2.2.0"
pinact = "5.0.0"
biome = "2.5.4"
ghalint = "1.5.6"
gitleaks = "8.30.1"
hk = "2.9.0"
lua = "5.4"
"aqua:Kampfkarren/selene" = "0.32.0"
uv = "0.13.1"
rumdl = "0.2.78"
stylua = "2.5.2"
tombi = "1.7.1"
typos = "1.50.3"
"github:owenlamont/ryl" = "0.26.1"

[env]
HS_MOCK_VERSION = "1.0.0"

[tasks.docs]
run = "uvx --from git+https://github.com/hugoh/spoon-tools spoon-generate-docs"
description = "Generate docs/docs.json and docs/index.html from docstrings"

[tasks.package]
depends = ["docs"]
run = """
rm -rf dist
mkdir -p dist/AppBadgeWatcher.spoon
cp init.lua LICENSE README.md docs/docs.json dist/AppBadgeWatcher.spoon/
cd dist
zip -r ../AppBadgeWatcher.spoon.zip AppBadgeWatcher.spoon
cd ..
rm -rf dist
"""
description = "Build a self-contained AppBadgeWatcher.spoon.zip (includes docs.json)"

[tasks.deps]
description = "Install the pinned hs_mock into the project-local .rocks tree"
run = "luarocks install --tree .rocks hs-mock $HS_MOCK_VERSION"
sources = ["mise.toml"]
outputs = [".rocks/lib/luarocks/rocks-5.4/hs-mock/*/rock_manifest"]

[tasks.test]
depends = ["deps"]
run = "busted test_spec.lua --verbose"

[hooks]
postinstall = ["luarocks install busted"]
